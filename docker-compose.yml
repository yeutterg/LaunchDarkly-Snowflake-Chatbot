services:
  chatbot-backend:
    build:
      context: ./gravity-farms-chatbot-backend
      dockerfile: Dockerfile
    container_name: gravity-farms-chatbot-backend
    ports:
      - "3001:3001"
    environment:
      # Server Configuration
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
      
      # Demo Mode - Set to false for production with real credentials
      - DEMO_MODE=${DEMO_MODE:-true}
      
      # Snowflake REST API Configuration (required for production)
      - SNOWFLAKE_ACCOUNT_IDENTIFIER=${SNOWFLAKE_ACCOUNT_IDENTIFIER:-}
      - SNOWFLAKE_PAT=${SNOWFLAKE_PAT:-}
      
      # LaunchDarkly Configuration (required for production)
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY:-}
      - LAUNCHDARKLY_AI_CONFIG_KEY=${LAUNCHDARKLY_AI_CONFIG_KEY:-gravity-farms-chatbot-config}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network

  # Run the existing Gravity Farms frontend with ChatWidget
  gravity-farms-frontend:
    image: node:18-alpine
    container_name: gravity-farms-frontend
    working_dir: /app
    volumes:
      - ./farm-fresh-pet-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - BROWSER=none  # Prevent auto-opening browser
    command: >
      sh -c "
      echo '🚀 Installing frontend dependencies...' &&
      npm install &&
      echo '✅ Dependencies installed!' &&
      echo '' &&
      echo '⏳ Waiting for backend to be ready...' &&
      while ! wget -q --spider http://chatbot-backend:3001/health; do
        sleep 1;
      done &&
      echo '✅ Backend is ready!' &&
      echo '' &&
      echo '=====================================' &&
      echo '🎮 GRAVITY FARMS FRONTEND STARTING' &&
      echo '=====================================' &&
      echo '' &&
      echo '📱 Frontend URL: http://localhost:3000' &&
      echo '🔌 Backend API: http://localhost:3001' &&
      echo '' &&
      echo '👉 Open http://localhost:3000 in your browser' &&
      echo '=====================================' &&
      echo '' &&
      npm run dev -- --host 0.0.0.0 --port 3000
      "
    networks:
      - chatbot-network
    depends_on:
      - chatbot-backend
    profiles:
      - demo

networks:
  chatbot-network:
    driver: bridge

# USAGE:
# ------
# Demo mode (default):
#   docker-compose --profile demo up
#   Then open http://localhost:3000
#
# Backend API only (For integration with existing frontend):
#   docker-compose up chatbot-backend
#
# Production mode:
#   1. Create .env file with real credentials:
#      SNOWFLAKE_ACCOUNT_IDENTIFIER=your-account.snowflakecomputing.com
#      SNOWFLAKE_PAT=your_personal_access_token
#      LAUNCHDARKLY_SDK_KEY=sdk-xxxx-xxxx-xxxx
#      LAUNCHDARKLY_AI_CONFIG_KEY=gravity-farms-chatbot-config
#   2. Run with production mode:
#      DEMO_MODE=false docker-compose up chatbot-backend